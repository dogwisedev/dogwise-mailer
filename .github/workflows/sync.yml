name: Sync to Personal Repo

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Personal Repo
        run: |
          git remote add target https://x-access-token:${{ secrets.MAILER_BACKUP }}@github.com/AlmaSomerville/mailerapp.git
          git push target HEAD:main --force
